name: .NET CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore LLRPCSharp.slnx

    - name: Verify generated source encoding
      shell: pwsh
      run: ./tools/Verify-SourceEncoding.ps1

    - name: Build Solution
      run: dotnet build LLRPCSharp.slnx --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test LLRPCSharp.slnx --no-build --configuration Release
