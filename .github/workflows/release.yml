name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v0.5.0
        required: true
        default: v0.5.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Pack & Publish
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate release version
      id: release
      shell: bash
      env:
        RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      run: |
        set -euo pipefail
        release_tag="$RELEASE_TAG_INPUT"
        if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Release tag must match vMAJOR.MINOR.PATCH, got: $release_tag" >&2
          exit 1
        fi

        version="${release_tag#v}"
        project_version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props | head -n 1)"
        if [[ -z "$project_version" || "$project_version" != "$version" ]]; then
          echo "Tag $release_tag does not match Directory.Build.props version $project_version" >&2
          exit 1
        fi

        release_doc="docs/releases/${release_tag}.md"
        if [[ ! -f "$release_doc" ]]; then
          echo "Missing release notes: $release_doc" >&2
          exit 1
        fi

        echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "release_doc=$release_doc" >> "$GITHUB_OUTPUT"

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore LLRPCSharp.slnx -p:EnableWindowsTargeting=true

    - name: Verify generated source encoding
      shell: pwsh
      run: ./tools/Verify-SourceEncoding.ps1

    - name: Build Solution (Release)
      run: dotnet build LLRPCSharp.slnx --no-restore --configuration Release -p:EnableWindowsTargeting=true

    - name: Run Automated Tests
      run: |
        dotnet test tests/LlrpNet.ProtocolModel.Tests/LlrpNet.ProtocolModel.Tests.csproj --no-build --configuration Release -p:EnableWindowsTargeting=true
        dotnet test tests/LlrpNet.ProtocolGenerator.Tests/LlrpNet.ProtocolGenerator.Tests.csproj --no-build --configuration Release -p:EnableWindowsTargeting=true
        dotnet test tests/LlrpNet.Core.Tests/LlrpNet.Core.Tests.csproj --no-build --configuration Release -p:EnableWindowsTargeting=true
        dotnet test tests/LlrpNet.Protocol.Tests/LlrpNet.Protocol.Tests.csproj --no-build --configuration Release -p:EnableWindowsTargeting=true
        dotnet test tests/LlrpNet.Protocol.Impinj.Tests/LlrpNet.Protocol.Impinj.Tests.csproj --no-build --configuration Release -p:EnableWindowsTargeting=true
        dotnet test tests/LlrpSdk.Tests/LlrpSdk.Tests.csproj --no-build --configuration Release -p:EnableWindowsTargeting=true
        dotnet test tests/LlrpSdk.Extensions.Impinj.Tests/LlrpSdk.Extensions.Impinj.Tests.csproj --no-build --configuration Release -p:EnableWindowsTargeting=true
        dotnet test tests/LlrpCli.Tests/LlrpCli.Tests.csproj --no-build --configuration Release -p:EnableWindowsTargeting=true
        dotnet test tests/Interop.Tests/Interop.Tests.csproj --no-build --configuration Release -p:EnableWindowsTargeting=true

    - name: Clean Artifacts Directory
      run: rm -rf ./artifacts

    - name: Pack NuGet Packages
      run: |
        dotnet pack src/LlrpSdk/LlrpSdk.csproj --no-build --configuration Release -p:EnableWindowsTargeting=true --output ./artifacts/nupkgs
        dotnet pack src/LlrpSdk.Extensions.Impinj/LlrpSdk.Extensions.Impinj.csproj --no-build --configuration Release -p:EnableWindowsTargeting=true --output ./artifacts/nupkgs

    - name: Publish LlrpCli (win-x64)
      run: dotnet publish src/LlrpCli/LlrpCli.csproj --configuration Release --runtime win-x64 --self-contained true --output ./artifacts/cli-win-x64

    - name: Publish LlrpCli (linux-x64)
      run: dotnet publish src/LlrpCli/LlrpCli.csproj --configuration Release --runtime linux-x64 --self-contained true --output ./artifacts/cli-linux-x64

    - name: Publish LlrpCli (osx-x64)
      run: dotnet publish src/LlrpCli/LlrpCli.csproj --configuration Release --runtime osx-x64 --self-contained true --output ./artifacts/cli-osx-x64

    - name: Publish LlrpCli (osx-arm64)
      run: dotnet publish src/LlrpCli/LlrpCli.csproj --configuration Release --runtime osx-arm64 --self-contained true --output ./artifacts/cli-osx-arm64

    - name: Package LlrpCli archives
      run: |
        for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
          cp README.md "./artifacts/cli-${rid}/"
          cp LICENSE "./artifacts/cli-${rid}/"
          (cd "./artifacts/cli-${rid}" && zip -r "../LlrpCli-${{ steps.release.outputs.tag }}-${rid}.zip" .)
        done

    - name: Publish to NuGet.org
      run: |
        dotnet nuget push "./artifacts/nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release.outputs.tag }}
        name: LLRPCSharp ${{ steps.release.outputs.tag }}
        files: |
          ./artifacts/nupkgs/*.nupkg
          ./artifacts/nupkgs/*.snupkg
          ./artifacts/LlrpCli-*.zip
        draft: false
        prerelease: false
        body_path: ${{ steps.release.outputs.release_doc }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
