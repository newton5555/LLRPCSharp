<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="layer-cli-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="layer-sdk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="layer-net-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="layer-device-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="card-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="460" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">LLRPCSharp System Architecture</text>
  <text x="460" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">3-Layer Architecture Overview &amp; Module Boundaries</text>

  <!-- Layer 3: Application & Client Layer -->
  <rect x="40" y="85" width="840" height="95" rx="12" fill="url(#layer-cli-bg)" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="52" y="97" width="160" height="24" rx="6" fill="#1e3a8a"/>
  <text x="132" y="113" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="700">LAYER 3 · APPLICATION</text>

  <g transform="translate(230, 97)">
    <!-- Card 1: LlrpCli Command Line Tool -->
    <rect x="0" y="0" width="300" height="70" rx="8" fill="url(#card-blue)" stroke="#3b82f6" stroke-width="1"/>
    <text x="150" y="24" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">LlrpCli Command Line Tool</text>
    <text x="150" y="44" text-anchor="middle" fill="#93c5fd" font-size="11">Interactive Live Shell &amp; Agent Scripts</text>
    <text x="150" y="58" text-anchor="middle" fill="#94a3b8" font-size="10">Used for operations, debugging &amp; automation</text>

    <!-- Card 2: Custom Client Applications -->
    <rect x="320" y="0" width="310" height="70" rx="8" fill="url(#card-blue)" stroke="#3b82f6" stroke-width="1"/>
    <text x="475" y="24" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Custom Business Applications</text>
    <text x="475" y="44" text-anchor="middle" fill="#93c5fd" font-size="11">User RFID Services / Apps / Microservices</text>
    <text x="475" y="58" text-anchor="middle" fill="#94a3b8" font-size="10">Integration entry point consuming LlrpSdk</text>
  </g>

  <!-- Arrow 3 -> 2 -->
  <path d="M 460 180 L 460 203" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Layer 2: Managed Reader SDK Layer -->
  <rect x="40" y="210" width="840" height="110" rx="12" fill="url(#layer-sdk-bg)" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="52" y="222" width="160" height="24" rx="6" fill="#4c1d95"/>
  <text x="132" y="238" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700">LAYER 2 · MANAGED SDK</text>

  <g transform="translate(230, 222)">
    <!-- Card 1: LlrpReader Facade -->
    <rect x="0" y="0" width="200" height="84" rx="8" fill="url(#card-purple)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="100" y="26" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">LlrpReader Facade</text>
    <text x="100" y="46" text-anchor="middle" fill="#c4b5fd" font-size="11">High-Level Control API</text>
    <text x="100" y="64" text-anchor="middle" fill="#94a3b8" font-size="10">ConnectAsync &amp; Auto-Negotiation</text>

    <!-- Card 2: Settings & Inventory Management -->
    <rect x="215" y="0" width="210" height="84" rx="8" fill="url(#card-purple)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="320" y="26" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">ReaderSettings &amp; Session</text>
    <text x="320" y="46" text-anchor="middle" fill="#c4b5fd" font-size="11">Auto ROSpec/AccessSpec Assembly</text>
    <text x="320" y="64" text-anchor="middle" fill="#94a3b8" font-size="10">Simplified TagReport Stream &amp; Access</text>

    <!-- Card 3: Vendor Extension Pipeline -->
    <rect x="440" y="0" width="190" height="84" rx="8" fill="url(#card-purple)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="535" y="26" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Vendor Extensions</text>
    <text x="535" y="46" text-anchor="middle" fill="#c4b5fd" font-size="11">UseImpinj() Contributors</text>
    <text x="535" y="64" text-anchor="middle" fill="#94a3b8" font-size="10">Custom Specs &amp; Parameter Hooks</text>
  </g>

  <!-- Arrow 2 -> 1 -->
  <path d="M 460 320 L 460 343" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Layer 1: Protocol & Core Networking Layer -->
  <rect x="40" y="350" width="840" height="105" rx="12" fill="url(#layer-net-bg)" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="52" y="362" width="160" height="24" rx="6" fill="#164e63"/>
  <text x="132" y="378" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="700">LAYER 1 · PROTOCOL / NET</text>

  <g transform="translate(230, 362)">
    <!-- Card 1: LlrpNet.Core (Networking) -->
    <rect x="0" y="0" width="300" height="80" rx="8" fill="url(#card-cyan)" stroke="#06b6d4" stroke-width="1"/>
    <text x="150" y="26" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">LlrpNet.Core (TCP &amp; Networking)</text>
    <text x="150" y="46" text-anchor="middle" fill="#67e8f9" font-size="11">TCP Connection, Framing &amp; Packet Splitting</text>
    <text x="150" y="64" text-anchor="middle" fill="#94a3b8" font-size="10">Async Transaction Matching &amp; Raw Observer</text>

    <!-- Card 2: LlrpNet.Protocol (Codecs) -->
    <rect x="320" y="0" width="310" height="80" rx="8" fill="url(#card-cyan)" stroke="#06b6d4" stroke-width="1"/>
    <text x="475" y="26" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">LlrpNet.Protocol (Binary Codecs)</text>
    <text x="475" y="46" text-anchor="middle" fill="#67e8f9" font-size="11">LLRP Messages, Parameters &amp; CodecRegistry</text>
    <text x="475" y="64" text-anchor="middle" fill="#94a3b8" font-size="10">Definition-Driven Code Generator Output (.g.cs)</text>
  </g>

  <!-- Arrow 1 -> Devices -->
  <path d="M 460 455 L 460 473" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom: Readers & Simulators -->
  <rect x="40" y="475" width="840" height="65" rx="10" fill="url(#layer-device-bg)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="52" y="495" width="160" height="24" rx="6" fill="#064e3b"/>
  <text x="132" y="511" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">READERS &amp; TEST CI</text>

  <g transform="translate(250, 487)">
    <rect x="0" y="0" width="280" height="42" rx="6" fill="url(#card-emerald)" stroke="#10b981" stroke-width="1"/>
    <text x="140" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Physical LLRP RFID Readers</text>

    <rect x="300" y="0" width="280" height="42" rx="6" fill="url(#card-emerald)" stroke="#10b981" stroke-width="1"/>
    <text x="440" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">LlrpVirtualReader (Mock / CI Testing)</text>
  </g>

</svg>
