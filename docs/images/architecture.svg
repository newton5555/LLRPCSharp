<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <style>
      .layer-title { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 700; font-size: 20px; fill: #FFFFFF; text-anchor: middle; }
      .box-title { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 600; font-size: 16px; fill: #FFFFFF; text-anchor: middle; }
      .box-desc { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 400; font-size: 13px; fill: rgba(255,255,255,0.85); text-anchor: middle; }
    </style>
  </defs>

  <!-- LAYER 3: Applications & CLI (Blue) -->
  <rect x="20" y="20" width="1160" height="160" rx="12" fill="#0284C7" />
  <text x="600" y="52" class="layer-title">Layer 3 · Application &amp; CLI Layer (Client &amp; CLI)</text>
  
  <rect x="40" y="70" width="540" height="90" rx="8" fill="#0369A1" />
  <text x="310" y="108" class="box-title">LlrpCli Command Line Tool</text>
  <text x="310" y="134" class="box-desc">Interactive Live Shell / Agent Scripts / Operations &amp; Diagnostics</text>

  <rect x="620" y="70" width="540" height="90" rx="8" fill="#0369A1" />
  <text x="890" y="108" class="box-title">Custom Business Applications</text>
  <text x="890" y="134" class="box-desc">Warehouse Portals / Smart Cabinets / Production Line Tracking Services</text>

  <!-- LAYER 2: Managed SDK Layer (Purple) -->
  <rect x="20" y="200" width="1160" height="170" rx="12" fill="#6D28D9" />
  <text x="600" y="232" class="layer-title">Layer 2 · Managed SDK Layer (LlrpSdk - Inspired by Impinj Octane SDK)</text>

  <rect x="40" y="250" width="350" height="100" rx="8" fill="#5B21B6" />
  <text x="215" y="292" class="box-title">LlrpReader Facade API</text>
  <text x="215" y="318" class="box-desc">Connection Management / Auto-Negotiation</text>

  <rect x="415" y="250" width="370" height="100" rx="8" fill="#5B21B6" />
  <text x="600" y="292" class="box-title">ReaderSettings &amp; Configuration</text>
  <text x="600" y="318" class="box-desc">Automated ROSpec &amp; AccessSpec Assembly</text>

  <rect x="810" y="250" width="350" height="100" rx="8" fill="#5B21B6" />
  <text x="985" y="292" class="box-title">Vendor Extensions (UseImpinj)</text>
  <text x="985" y="318" class="box-desc">Serialized TID / Phase Angle / Custom Hooks</text>

  <!-- LAYER 1: Protocol & Net Layer (Teal/Cyan) -->
  <rect x="20" y="390" width="1160" height="170" rx="12" fill="#0D9488" />
  <text x="600" y="422" class="layer-title">Layer 1 · Protocol &amp; Networking Layer (LlrpNet - Modernized LTK.NET)</text>

  <rect x="40" y="440" width="540" height="100" rx="8" fill="#0F766E" />
  <text x="310" y="482" class="box-title">LlrpNet.Core (Networking &amp; Transport)</text>
  <text x="310" y="508" class="box-desc">TCP Transport Lifecycle / Frame Splitting / Frame Observer</text>

  <rect x="620" y="440" width="540" height="100" rx="8" fill="#0F766E" />
  <text x="890" y="482" class="box-title">LlrpNet.Protocol (Binary Codecs)</text>
  <text x="890" y="508" class="box-desc">LTK.NET Modernization / Strongly Typed Messages &amp; Generated Code (.g.cs)</text>

  <!-- LAYER 0: Readers (Emerald) -->
  <rect x="20" y="580" width="1160" height="170" rx="12" fill="#059669" />
  <text x="600" y="612" class="layer-title">Hardware Layer (Readers)</text>

  <rect x="40" y="630" width="1120" height="100" rx="8" fill="#047857" />
  <text x="600" y="672" class="box-title">📡 Physical LLRP RFID Reader Hardware</text>
  <text x="600" y="698" class="box-desc">Impinj / Seuic / Standard LLRP 1.0.1 &amp; 1.1 Hardware Devices</text>
</svg>
