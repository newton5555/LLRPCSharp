<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="sq-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="sq-arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c4b5fd" />
    </marker>
    <marker id="sq-arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="sq-arrow-dashed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>

    <linearGradient id="header-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="460" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Managed Reader Lifecycle &amp; Inventory Data Flow</text>
  <text x="460" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">High-Level Reader Control &amp; Asynchronous Tag Streaming Sequence</text>

  <!-- Lifeline Columns -->
  <!-- Column 1: Client App (X=140) -->
  <line x1="140" y1="120" x2="140" y2="490" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="60" y="80" width="160" height="36" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="103" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">Client Application</text>

  <!-- Column 2: LlrpReader SDK (X=390) -->
  <line x1="390" y1="120" x2="390" y2="490" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="310" y="80" width="160" height="36" rx="8" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="390" y="103" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">LlrpReader (SDK)</text>

  <!-- Column 3: Protocol Adapter / Net Core (X=640) -->
  <line x1="640" y1="120" x2="640" y2="490" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="555" y="80" width="170" height="36" rx="8" fill="#164e63" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="640" y="103" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="600">LlrpNet Protocol / Core</text>

  <!-- Column 4: Physical RFID Reader (X=830) -->
  <line x1="830" y1="120" x2="830" y2="490" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="750" y="80" width="160" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="830" y="103" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">LLRP Reader Hardware</text>

  <!-- Sequence Step 1: ConnectAsync -->
  <g transform="translate(0, 140)">
    <line x1="140" y1="0" x2="384" y2="0" stroke="#60a5fa" stroke-width="2" marker-end="url(#sq-arrow)"/>
    <text x="260" y="-8" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="500">1. ConnectAsync()</text>

    <line x1="390" y1="20" x2="824" y2="20" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#sq-arrow-purple)"/>
    <text x="600" y="12" text-anchor="middle" fill="#c4b5fd" font-size="11">TCP Connect &amp; Negotiation (1.0.1 / 1.1)</text>

    <line x1="830" y1="38" x2="396" y2="38" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#sq-arrow-dashed)"/>
    <text x="600" y="32" text-anchor="middle" fill="#94a3b8" font-size="10">READER_EVENT_NOTIFICATION (Connection Success)</text>
  </g>

  <!-- Sequence Step 2: Query / Apply ReaderSettings -->
  <g transform="translate(0, 215)">
    <line x1="140" y1="0" x2="384" y2="0" stroke="#60a5fa" stroke-width="2" marker-end="url(#sq-arrow)"/>
    <text x="260" y="-8" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="500">2. ApplySettingsAsync(settings)</text>

    <line x1="390" y1="18" x2="634" y2="18" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#sq-arrow-purple)"/>
    <text x="510" y="10" text-anchor="middle" fill="#c4b5fd" font-size="11">Compile ROSpec / AccessSpec</text>

    <line x1="640" y1="36" x2="824" y2="36" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#sq-arrow)"/>
    <text x="735" y="28" text-anchor="middle" fill="#67e8f9" font-size="10">ADD_ROSPEC / ENABLE_ROSPEC</text>

    <line x1="830" y1="52" x2="396" y2="52" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#sq-arrow-dashed)"/>
    <text x="612" y="46" text-anchor="middle" fill="#94a3b8" font-size="10">ADD_ROSPEC_RESPONSE (Success)</text>
  </g>

  <!-- Sequence Step 3: Start Inventory Session -->
  <g transform="translate(0, 305)">
    <line x1="140" y1="0" x2="384" y2="0" stroke="#60a5fa" stroke-width="2" marker-end="url(#sq-arrow)"/>
    <text x="260" y="-8" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="500">3. StartInventoryAsync()</text>

    <line x1="390" y1="18" x2="824" y2="18" stroke="#34d399" stroke-width="1.5" marker-end="url(#sq-arrow-emerald)"/>
    <text x="600" y="10" text-anchor="middle" fill="#6ee7b7" font-size="11">START_ROSPEC (Begin RF Scan)</text>

    <!-- Return InventorySession -->
    <line x1="390" y1="38" x2="146" y2="38" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#sq-arrow-emerald)"/>
    <text x="260" y="30" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">Returns InventorySession</text>
  </g>

  <!-- Sequence Step 4: Tag Streaming (Loop / ReadReportsAsync) -->
  <g transform="translate(0, 375)">
    <!-- Loop Box -->
    <rect x="110" y="-5" width="740" height="55" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1" stroke-dasharray="4 2"/>
    <rect x="110" y="-5" width="140" height="18" rx="4" fill="#059669"/>
    <text x="180" y="8" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">TAG STREAMING LOOP</text>

    <line x1="830" y1="28" x2="646" y2="28" stroke="#10b981" stroke-width="1.5" marker-end="url(#sq-arrow-emerald)"/>
    <text x="738" y="20" text-anchor="middle" fill="#6ee7b7" font-size="10">RO_ACCESS_REPORT (Binary Frames)</text>

    <line x1="640" y1="38" x2="146" y2="38" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#sq-arrow-emerald)"/>
    <text x="390" y="32" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">yield return TagReport (EPC, RSSI, Antenna, Phase)</text>
  </g>

  <!-- Sequence Step 5: Stop & Disconnect -->
  <g transform="translate(0, 455)">
    <line x1="140" y1="0" x2="384" y2="0" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#sq-arrow)"/>
    <text x="260" y="-8" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="500">4. DisposeAsync() / StopInventoryAsync()</text>

    <line x1="390" y1="16" x2="824" y2="16" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#sq-arrow-dashed)"/>
    <text x="600" y="8" text-anchor="middle" fill="#94a3b8" font-size="11">STOP_ROSPEC / CLOSE_CONNECTION</text>
  </g>
</svg>
