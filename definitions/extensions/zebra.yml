# Zebra FX9600 LLRP 1.0.1 extension draft.
#
# Source: docs/references/zebra/interface-control-guide-en.pdf (72E-131718-13EN,
# Rev A, March 2025). Vendor ID is 161. This file intentionally contains the
# FX9600-supported subset; PDF-defined items marked N for FX9600 are not emitted.
#
# This is a protocol-definition input, not a high-level SDK capability profile.
# The SDK must still gate features using reader capabilities and product support.
# ZebraROTriggerSpec has no explicit allowedIn declaration in the PDF and is
# therefore left without allowedIn until a real-reader capture confirms it.

namespace:
  prefix: zebra
  uri: https://www.zebra.com/llrp/1.0.1/extensions
  schemaLocation: https://www.zebra.com/llrp/1.0.1/extensions

messages: []
parameters: []
enumerations: []

choices:
  - name: MotoFilterTimeFormatChoice
    parameterTypes:
      - MotoFilterTimeOfDay
      - MotoUTCTimestamp

vendors:
  - name: Zebra
    vendorId: 161

customMessages:
  - name: MOTO_GET_TAG_EVENT_REPORT
    vendor: Zebra
    subtype: 2
    namespace: zebra
    members: []

  - name: MOTO_PURGE_TAGS
    vendor: Zebra
    subtype: 3
    namespace: zebra
    responseType: MOTO_PURGE_TAGS_RESPONSE
    members:
      - field:
          name: PurgeTagEventStateOnly
          type: u1
      - reserved: 7
      # FX9600 does not support an explicit tag list; empty payload means all.
      - field:
          name: Data
          type: bytesToEnd
          format: Hex

  - name: MOTO_PURGE_TAGS_RESPONSE
    vendor: Zebra
    subtype: 4
    namespace: zebra
    members:
      - parameter:
          type: LLRPStatus
          cardinality: "1"

  - name: MOTO_TAG_EVENT_NOTIFY
    vendor: Zebra
    subtype: 5
    namespace: zebra
    members: []

